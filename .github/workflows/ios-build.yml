name: iOS Build & Upload

# 公開リポジトリなので GitHub Actions は無料・時間制限なし（標準ランナー）。
# 単語データは <app>/content.enc に暗号化してあり、ビルドの直前にだけ復号する。.ipa は保存しない。
#
# 必要な Secrets
#   CONTENT_KEY                         単語データの復号鍵（64桁の16進）
#   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD / APPLE_TEAM_ID
#   APP_STORE_CONNECT_API_KEY_ID / APP_STORE_CONNECT_API_ISSUER_ID / APP_STORE_CONNECT_API_KEY
#   IOS_PROFILE_<言語を大文字で>          配布プロファイル（base64）例: IOS_PROFILE_GERMAN

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'ビルドするアプリ（カンマ区切り。例: hanaseru-german,hanaseru-italian）'
        required: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        env:
          IN: ${{ github.event.inputs.apps }}
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os, re
          apps = [x.strip() for x in os.environ["IN"].split(",") if x.strip()]
          assert apps and all(re.fullmatch(r"hanaseru-[a-z]+", a) for a in apps), apps
          print("list=" + json.dumps([{"dir": a, "key": a.split("-", 1)[1].upper()} for a in apps]))
          PY

  build:
    needs: matrix
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.matrix.outputs.list) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unseal word data
        working-directory: .
        env:
          CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
        run: bash tools/unseal.sh "${{ matrix.app.dir }}" && test -s "${{ matrix.app.dir }}/data/words.json"

      - name: Select Xcode 26 whose iOS SDK is App-Store-accepted
        run: |
          pick_xcode() {
            for candidate in $1; do
              [ -d "$candidate" ] || continue
              if DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -qi "iphoneos"; then
                echo "$candidate"; return 0
              fi
            done
            return 1
          }
          XCODE_PATH=""
          for mm in 26.4 26.3 26.2 26.1 26.0; do
            cands=$(ls -d /Applications/Xcode_${mm}*.app 2>/dev/null | grep -v beta | sort -Vr)
            if [ -n "$cands" ]; then
              picked=$(pick_xcode "$cands" || true)
              [ -n "$picked" ] && { XCODE_PATH="$picked"; break; }
            fi
          done
          [ -n "$XCODE_PATH" ] || XCODE_PATH=$(pick_xcode "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -Vr)" || echo /Applications/Xcode.app)
          sudo xcode-select -switch "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Download iOS platform if missing
        run: |
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -showsdks | grep -i iphone || sudo xcodebuild -downloadPlatform iOS || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Set build number (unique per run)
        run: |
          cd ios
          xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER"
          for plist in $(find . -name "Info.plist" -not -path "./Pods/*"); do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist" 2>/dev/null || true
          done

      - name: Pod install
        run: cd ios && pod install

      - name: Patch fmt headers for Xcode 26 Clang strictness
        run: |
          for header in ios/Pods/fmt/include/fmt/base.h ios/Pods/fmt/include/fmt/core.h ios/Pods/fmt/include/fmt/format.h; do
            [ -f "$header" ] || continue
            sed -i.bak 's/# *define FMT_CONSTEVAL consteval/#define FMT_CONSTEVAL constexpr/g' "$header"
          done
          for f in ios/Pods/Target\ Support\ Files/fmt/fmt.*.xcconfig; do
            [ -f "$f" ] || continue
            printf '\n// fmt Xcode 26 consteval workaround (CI patch)\nGCC_PREPROCESSOR_DEFINITIONS = $(inherited) FMT_USE_CONSTEVAL=0\nCLANG_CXX_LANGUAGE_STANDARD = gnu++17\n' >> "$f"
          done

      - name: Import iOS Distribution Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain; KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo -n "$P12_BASE64" | base64 -D > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Import Provisioning Profile
        id: profile
        env:
          B64: ${{ secrets[format('IOS_PROFILE_{0}', matrix.app.key)] }}
        run: |
          [ -n "$B64" ] || { echo "::error::Secret IOS_PROFILE_${{ matrix.app.key }} がありません"; exit 1; }
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"; mkdir -p "$PROFILE_DIR"
          printf '%s' "$B64" | base64 -D > "$PROFILE_DIR/app.mobileprovision"
          PLIST=$(security cms -D -i "$PROFILE_DIR/app.mobileprovision")
          echo "name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")" >> $GITHUB_OUTPUT

      - name: Build & Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          BUNDLE_ID=$(python3 -c "import json;print(json.load(open('app.json'))['expo']['ios']['bundleIdentifier'])")
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          mkdir -p build
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -archivePath build/app.xcarchive -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          xcodebuild -exportArchive -archivePath build/app.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export

      - name: Upload .ipa to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios --file "$(ls build/export/*.ipa)" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # .ipa は保存しない（公開リポジトリの保存ファイルは誰でもダウンロードできるため）
